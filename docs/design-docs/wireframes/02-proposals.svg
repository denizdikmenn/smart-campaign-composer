<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><rect width="1440" height="960" fill="#EEF3EB"/><text x="24" y="31" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="600" fill="#536D60">CAMPAIGN STUDIO / DESIGN HANDOFF</text><text x="760" y="31" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">02 · Chat + audience proposals · Desktop 1440 × 960</text><rect x="20" y="54" width="188" height="886" rx="20" fill="#204D3C" stroke="#DCE4D9"/><text x="40" y="109" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Campaign</text><text x="40" y="138" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Studio</text><rect x="32" y="200" width="164" height="44" rx="10" fill="#406753" stroke="#DCE4D9"/><text x="45" y="228" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Campaigns</text><text x="44" y="282" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#EDF3EB">Audience Explorer</text><text x="40" y="874" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#DDE8B5">Demo workspace</text><text x="40" y="898" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#DDE8B5">Case study</text><rect x="228" y="54" width="1192" height="64" rx="16" fill="#FFFFFF" stroke="#DCE4D9"/><text x="250" y="94" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#204D3C">Untitled campaign</text><text x="1174" y="93" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Draft · Saved</text><text x="250" y="157" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#536D60">Audience   →   Content   →   Review   →   Delivery</text><text x="1180" y="157" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Step 1 of 4</text><rect x="228" y="184" width="318" height="670" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="248" y="224" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="600" fill="#204D3C">Campaign assistant</text><rect x="244" y="254" width="286" height="110" rx="14" fill="#F0F4ED" stroke="#DCE4D9"/><text x="260" y="284" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#204D3C">Istanbul cart abandoners,</text><text x="260" y="305" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#204D3C">electronics, last 30 days.</text><text x="260" y="326" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#204D3C">Offer a 20% discount.</text><text x="248" y="400" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="600" fill="#536D60">Assistant</text><text x="248" y="427" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#204D3C">Three audience options are ready.</text><text x="248" y="448" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#204D3C">The first matches your brief.</text><text x="248" y="469" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#204D3C">Compare scope and reach</text><text x="248" y="490" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#204D3C">before selecting one.</text><rect x="244" y="716" width="286" height="118" rx="14" fill="#F8FAF6" stroke="#DCE4D9"/><text x="260" y="747" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Ask for a change…</text><text x="260" y="768" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Example: extend to 60 days</text><text x="485" y="813" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="600" fill="#204D3C">Send</text><text x="574" y="226" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="600" fill="#204D3C">Choose your audience</text><text x="574" y="256" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#536D60">Compare the targeting differences and channel reach.</text><rect x="570" y="292" width="830" height="148" rx="14" fill="#F1F6E1" stroke="#8EA760"/><text x="590" y="328" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#204D3C">●  Cart abandoners</text><text x="1200" y="326" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#536D60">Recommended</text><text x="590" y="366" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#204D3C">428 people</text><text x="820" y="365" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C">Email 337   ·   SMS 216</text><text x="590" y="393" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Closest match to your brief</text><text x="590" y="420" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#204D3C">View targeting rules</text><text x="1155" y="420" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#204D3C">Preview members →</text><rect x="570" y="454" width="830" height="148" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="590" y="490" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#204D3C">○  Broader reach</text><text x="590" y="528" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#204D3C">682 people</text><text x="820" y="527" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C">Email 511   ·   SMS 349</text><text x="590" y="555" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Category restriction removed</text><text x="590" y="582" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#204D3C">View targeting rules</text><text x="1155" y="582" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#204D3C">Preview members →</text><rect x="570" y="616" width="830" height="148" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="590" y="652" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#204D3C">○  Lapsed buyers</text><text x="590" y="690" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#204D3C">310 people</text><text x="820" y="689" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C">Email 228   ·   SMS 154</text><text x="590" y="717" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Targets past buyers instead of carts</text><text x="590" y="744" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#204D3C">View targeting rules</text><text x="1155" y="744" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#204D3C">Preview members →</text><rect x="570" y="798" width="830" height="56" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="590" y="832" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="600" fill="#204D3C">428 people selected</text><rect x="1145" y="805" width="235" height="42" rx="10" fill="#DDE8B5" stroke="#DCE4D9"/><text x="1161" y="831" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Use this audience</text><text x="248" y="920" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#536D60">Flow: refine in chat → recalculate → select. Preview members opens a drawer; selection requires a click.</text><text x="248" y="942" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="400" fill="#536D60">Wireframe: layout and behavior. Final font: Montserrat. All counts are illustrative.</text></svg>