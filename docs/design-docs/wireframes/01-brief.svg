<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960"><rect width="1440" height="960" fill="#EEF3EB"/><text x="24" y="31" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="600" fill="#536D60">CAMPAIGN STUDIO / DESIGN HANDOFF</text><text x="760" y="31" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">01 · Brief / first use · Desktop 1440 × 960</text><rect x="20" y="54" width="188" height="886" rx="20" fill="#204D3C" stroke="#DCE4D9"/><text x="40" y="109" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Campaign</text><text x="40" y="138" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">Studio</text><rect x="32" y="200" width="164" height="44" rx="10" fill="#406753" stroke="#DCE4D9"/><text x="45" y="228" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Campaigns</text><text x="44" y="282" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#EDF3EB">Audience Explorer</text><text x="40" y="874" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#DDE8B5">Demo workspace</text><text x="40" y="898" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#DDE8B5">Case study</text><rect x="228" y="54" width="1192" height="64" rx="16" fill="#FFFFFF" stroke="#DCE4D9"/><text x="250" y="94" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" fill="#204D3C">Untitled campaign</text><text x="1174" y="93" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Draft · Saved</text><text x="250" y="157" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#536D60">Audience   →   Content   →   Review   →   Delivery</text><text x="1180" y="157" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Step 1 of 4</text><text x="340" y="273" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="600" fill="#204D3C">What campaign do you want to create?</text><text x="340" y="311" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="400" fill="#536D60">Describe your audience, offer and channels.</text><text x="340" y="335" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="400" fill="#536D60">We will suggest audiences for you to review.</text><rect x="340" y="378" width="950" height="178" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="364" y="419" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="400" fill="#204D3C">Istanbul customers who added electronics to their cart</text><text x="364" y="444" font-family="Montserrat, Arial, sans-serif" font-size="17" font-weight="400" fill="#204D3C">in the last 30 days without purchasing. Offer 20% off.</text><text x="364" y="532" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#536D60">Campaign brief</text><rect x="1048" y="578" width="242" height="42" rx="10" fill="#DDE8B5" stroke="#DCE4D9"/><text x="1064" y="604" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Generate audiences</text><text x="340" y="662" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="600" fill="#536D60">TRY AN EXAMPLE</text><rect x="340" y="690" width="950" height="54" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="358" y="714" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Recover abandoned carts</text><text x="720" y="715" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Recent cart activity without a purchase</text><rect x="340" y="756" width="950" height="54" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="358" y="780" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Welcome new customers</text><text x="720" y="781" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="400" fill="#536D60">Joined recently and have not ordered</text><text x="248" y="920" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#536D60">Flow: submit → real loading state → workspace proposals. Errors preserve the brief.</text><text x="248" y="942" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="400" fill="#536D60">Wireframe: layout and behavior. Final font: Montserrat. All counts are illustrative.</text></svg>