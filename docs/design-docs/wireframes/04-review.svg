t-size="14" font-weight="600" fill="#204D3C">Cancel</text><rect x="1186" y="795" width="190" height="42" rx="10" fill="#DDE8B5" stroke="#DCE4D9"/><text x="1202" y="821" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Confirm send</text><text x="248" y="920" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="400" fill="#536D60">Later milestone. Confirm once → delivery detail. Pending disables repeat submission; errors preserve the draft.</text><text x="248" y="942" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="400" fill="#536D60">Wireframe: layout and behavior. Final font: Montserrat. All counts are illustrative.</text></svg>