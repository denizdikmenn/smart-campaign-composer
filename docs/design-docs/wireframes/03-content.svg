00" fill="#204D3C">Send</text><text x="574" y="226" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="600" fill="#204D3C">Prepare your message</text><text x="574" y="257" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#536D60">Audience: Cart abandoners · 428 people</text><rect x="570" y="284" width="830" height="48" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="590" y="314" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="600" fill="#204D3C">Email · 337 reachable</text><text x="870" y="314" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#536D60">SMS · 216 reachable</text><text x="590" y="374" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="600" fill="#536D60">EMAIL SUBJECT</text><rect x="570" y="390" width="830" height="50" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="590" y="422" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="400" fill="#204D3C">Your next purchase, with 20% off</text><text x="590" y="476" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="600" fill="#536D60">MESSAGE</text><rect x="570" y="490" width="400" height="230" rx="14" fill="#FFFFFF" stroke="#DCE4D9"/><text x="590" y="528" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C">Hi {{first_name}},</text><text x="590" y="550" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C"></text><text x="590" y="572" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C">Still thinking it over?</text><text x="590" y="594" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C">Return to your cart and enjoy</text><text x="590" y="616" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="400" fill="#204D3C">20% off with code WELCOME20.</text><rect x=