# Development overrides: Go hot reload (air) and Vite HMR with source bind-mounted.
services:
  backend:
    image: composer-backend-dev
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app

  frontend:
    image: composer-frontend-dev
    build:
      context: ./frontend
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
